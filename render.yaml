services:
  # ── Servicio 1: FastAPI REST API ───────────────────────────────────────────
  - type: web
    name: phishguard-api
    runtime: python
    plan: free
    buildCommand: /opt/render/project/src/.venv/bin/pip install -r requirements-api.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── Servicio 2: Streamlit UI ───────────────────────────────────────────────
  - type: web
    name: phishguard-ui
    runtime: python
    plan: free
    buildCommand: /opt/render/project/src/.venv/bin/pip install -r requirements-ui.txt
    startCommand: python -m streamlit run src/ui/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: API_BASE_URL
        value: https://phishguard-api.onrender.com
