[theme]
primaryColor        = "#F5C518"
backgroundColor     = "#E8E8E8"
secondaryBackgroundColor = "#FFFFFF"
textColor           = "#1A1A1A"
font                = "sans serif"

[server]
runOnSave = true
headless = true
enableCORS = false
enableXsrfProtection = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false
